[project]
name = "clawdence"
version = "0.1.0.dev0"
description = "Workflow-driven orchestration for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Clawdence authors" }]
keywords = ["agents", "orchestration", "workflow", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

# Every runtime dependency is pinned to an exact version and resolved through
# uv.lock — pinning from the first commit rather than retrofitting it later.
#
# pydantic is the single source of the domain model (S2): the Python types are
# authored once and the JSON Schema in `schemas/` is generated from them.
# PyYAML parses workflow files, and only ever through `yaml.safe_load` — the
# full loader constructs arbitrary Python objects, which for a file format the
# system executes would be remote code execution by configuration.
dependencies = [
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[project.scripts]
clawdence = "clawdence.cli:main"

[project.urls]
Homepage = "https://github.com/spectra-g/clawdence"

[dependency-groups]
dev = [
    # Validates domain instances against the *generated* schemas, so the JSON
    # Schema projection is proven faithful rather than merely committed.
    "jsonschema==4.26.0",
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "types-jsonschema==4.26.0.20260518",
    "types-pyyaml==6.0.12.20260724",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawdence"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "C4",   # comprehensions
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # asserts are the point of a test

[tool.mypy]
python_version = "3.12"
# The domain model is pydantic, so mypy needs the plugin to see synthesised
# __init__ signatures and frozen fields as read-only. Without it, strict mode
# checks less of the spine than it appears to.
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# Warnings are errors. The engine runs subprocesses under an event loop, where
# the failure mode is a resource finalised after the loop closed — which pytest
# reports as a warning and CI renders as an annotation on a green build. That is
# exactly the kind of thing that gets scrolled past, so it fails here instead.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/clawdence"]
branch = true
